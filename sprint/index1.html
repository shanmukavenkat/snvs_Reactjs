<div id="root"></div>

<script type="text/babel">
// we are calling as the component which is Hello
    function HELLO(props) {
        let {name ,age} = props; // destructuring
    //

    //------------------------------
        //let name = "snvskomal"
    //------------------------------
        return <h1>Welcome to the day {age} world of React by {name} </h1>; // jsx format
        // return `<h1>Welcome to the world of React by ${name} </h1>`; // js format
    }//jsx
    //syntax ReactDom.render(component,document.getElementById('root'))

///---------another component----------------

    function HELLOPARENT(){
        return(
            <div>
                <HELLO name={"Nxtwave"}> </HELLO>
                <HELLO name={"SNVSKOMAL"}> </HELLO>
                <HELLO name={"KOMAL"}> </HELLO>
            </div>
        )
    }















    ReactDOM.render(<HELLOPARENT name={"Nxtwave"} age={2}> </HELLOPARENT>, document.getElementById('root'));
//generally the ReactDOM that which make inject the hello component into the root div
